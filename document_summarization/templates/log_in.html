{% extends "base.html" %}
{% block body %}
<section class="page-section" id="contact">
    <div class="container">
        <!-- Contact Section Heading-->
        <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0 mt-5">Login Here</h2>
        <!-- Icon Divider-->
        <div class="divider-custom">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
        </div>
        <!-- Contact Section Form-->
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <form id="contactForm" data-sb-form-api-token="API_TOKEN" method="post">
                    {% csrf_token %}
                    <!-- Email address input-->
                    <div class="form-floating mb-3">
                        <input class="form-control" name="username" id="username" type="email" placeholder="name@example.com"
                            data-sb-validations="required,email" />
                        <label for="email">Email address</label>
                    </div>
                    <!-- Phone number input-->
                    <div class="form-floating mb-3">
                        <input class="form-control" name="password" id="password" type="password" placeholder="password"
                            data-sb-validations="required" />
                        <label for="phone">Password</label>
                        <div class="invalid-feedback" data-sb-feedback="phone:required">A password is required.
                        </div>
                    </div>
                    <!-- Submit Button-->
                    <button class="btn btn-primary btn-xl w-100" id="submitButton" type="submit">Login Here</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock body %}
